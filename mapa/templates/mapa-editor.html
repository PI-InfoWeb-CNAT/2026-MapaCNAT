{% extends 'base.html' %}

{% load static %}

{% block title %}MapaCNAT | Explorar{% endblock %}

{% block style %}
<link rel="stylesheet" type="text/css" href="{% static 'css/mapa.css' %}">
<style>
    .custom-cursor {
        cursor: url("{% static 'img/cursor-pin.png' %}") 12 24, auto;
    }
</style>
{% endblock %}

{% block content %}
<header>
    <div id="editor-modes">
        <a href="{% url 'home' %}" id="logo-wrapper"><img id="editor-logo" src="{% static 'img/logo-pequeno.png' %}"></a>
        <div class="button-list">
            <button class="padding icon editor-button" id="selection"><i class="fa-solid fa-hand"></i></button>
            <button class="padding icon editor-button" id="delete"><i class="fa-solid fa-trash"></i></button>
            <hr>
            <button class="padding icon editor-button" id="build"><i class="fa-solid fa-building"></i></button>
            <button class="padding icon editor-button" id="reference"><i class="fa-solid fa-map-pin"></i></button>
            <button class="padding icon editor-button" id="connection"><i class="fa-solid fa-circle-nodes"></i></button>
            <button class="padding icon editor-button" id="banner-btn"><i class="fa-solid fa-image"></i></button>
        </div>
        <button class="padding icon editor-button hidden" style="cursor: pointer;" id="submit"><i class="fa-solid fa-check"></i></button>
    </div>
    <div id="pin-mode" class="hidden">
        <button class="padding icon editor-button hidden" id="pin"><i class="fa-solid fa-check"></i></button>
        <button class="padding icon editor-button" id="pin"><img src="{% static 'img/pino.png' %}" width="32" alt="Pino de Construção"></button>
    </div>
</header>

<main>
    <section id="screen-ui">
        <article>
            <button class="padding icon editor-button" id="save"><i class="fa-solid fa-save"></i></button>
            
            <button class="padding icon editor-button hidden" id="expand-banner"><i class="fa-solid fa-angles-right"></i></button>
        </article>
        
        <article class="hidden" id="banner">
            <form class="banner-form" id="bannerForm">
                <label 
                    for="banner-image-input" 
                    class="image-upload-wrapper" 
                    id="image-upload-wrapper">
                    <span class="image-upload-label" id="image-upload-label">
                        adicionar imagem +
                    </span>
                    <input 
                        type="file" 
                        id="banner-image-input" 
                        accept="image/*">
                </label>

                <div class="banner-content">
                    <input 
                        type="text" 
                        class="editable-title" 
                        id="place-name" 
                        placeholder="Nome da construção">

                    <hr class="banner-divider">

                    <textarea 
                        class="editable-description" 
                        id="place-description" 
                        placeholder="Escreva uma descrição..."
                    ></textarea>
                </div>
            </form>
        </article>
    </section>
    

    <div id="map"></div>
    
    <script>
        const config = "{% static 'json/config.json' %}";
        const mapImage =  "{% static 'svg/mapa.svg' %}";
        const pinImage = "{% static 'img/pino.png' %}";
        const entranceImage = "{% static 'img/entrance.png' %}";
        const defaultUserImage = "{% static 'img/default-user.png' %}";
        const URLSaveMap = window.location.origin + "{% url 'mapa_editor_data' %}";
        const URLLoadMap = window.location.origin + "{% url 'mapa_editor_load' %}";
        let sharePlaceLat = false;
        let sharePlaceLong = false;
        const bannerURL = "{% url 'banner_image' 0 %}";
    </script>
    <script src="https://pixijs.download/release/pixi.min.js"></script>
    <script type="module" src="{% static 'js/mapa-editor.js' %}"></script>
</main>
{% endblock %}
