{% load static %}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="login-box">

        <h2>LOGIN</h2>

        <div class="input-group">
            <label>EMAIL</label>
            <input type="email" placeholder="seu.nome@email.com">
        </div>

        <div class="input-group">
            <label>SENHA</label>

            <div class="password">
                <input type="password" placeholder="Sua senha ultra-secreta">
                <button type="button">
                    <i class="fa-regular fa-eye"></i>
                </button>
            </div>
        </div>

        <button class="btn-login">ENTRAR</button>

        <div class="logo">
            <img src="{% static 'img/logo-pequeno.png' %}" alt="Logo">
        </div>

    </div>

</body>
</html>
