{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>{% block title %}MapaCNAT{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" type="text/css" rel="stylesheet">
    
    <link rel="stylesheet" type="text/css" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/toasts.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'css/modals.css' %}">
    {% block style %}{% endblock %}
    
    {% block meta %}{% endblock %}

    <link rel="shortcut icon" href="{% static 'img/icone.png' %}">
    <link rel="icon" href="{% static 'img/icone.png' %}">
    
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    {% block content %}
    {% endblock %}
    <script>
        (() => {
            const tooltip = document.createElement('div');
            tooltip.className = 'app-tooltip';
            tooltip.setAttribute('role', 'tooltip');
            document.body.appendChild(tooltip);

            let activeEl = null;

            function show(el) {
                // Converte title nativo automaticamente na primeira interação
                if (el.hasAttribute('title')) {
                    const titleText = el.getAttribute('title');
                    if (titleText) {
                        el.setAttribute('data-tooltip', titleText);
                        if (!el.hasAttribute('aria-label')) {
                            el.setAttribute('aria-label', titleText);
                        }
                    }
                    el.removeAttribute('title');
                }

                const text = el.getAttribute('data-tooltip');
                if (!text) return;

                activeEl = el;
                tooltip.textContent = text;
                tooltip.classList.add('is-visible');

                const rect = el.getBoundingClientRect();
                const tipRect = tooltip.getBoundingClientRect();
                const gap = 6;

                // Centraliza horizontalmente, mas impede de vazar pelas laterais da tela
                let left = rect.left + (rect.width - tipRect.width) / 2;
                left = Math.max(8, Math.min(left, window.innerWidth - tipRect.width - 8));

                // Abre em cima; se não houver espaço (ex: perto da nav), abre embaixo
                let top = rect.top - tipRect.height - gap;
                if (top < 8) {
                    top = rect.bottom + gap;
                }

                tooltip.style.transform = `translate3d(${Math.round(left)}px, ${Math.round(top)}px, 0)`;
            }

            function hide() {
                activeEl = null;
                tooltip.classList.remove('is-visible');
            }

            document.addEventListener('mouseover', (e) => {
                const target = e.target.closest('[data-tooltip], [title]');
                if (target && target !== activeEl) show(target);
            });

            document.addEventListener('mouseout', (e) => {
                if (activeEl && !activeEl.contains(e.relatedTarget)) hide();
            });

            document.addEventListener('focusin', (e) => {
                const target = e.target.closest('[data-tooltip], [title]');
                if (target) show(target);
            });

            document.addEventListener('focusout', hide);
            window.addEventListener('scroll', hide, true);
        })();
    </script>
    <script type="module" src="{% static 'js/modals.js' %}"></script>
</body>
</html>
