{% extends 'base.html' %}

{% load static %}

{% block title %}MapaCNAT | Explorar{% endblock %}

{% block style %}
<link rel="stylesheet" type="text/css" href="{% static 'css/mapa.css' %}">
{% endblock %}

{% block meta %}
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{% endblock %}

{% block content %}
<main id="app-layout">
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3><a href="{% url 'home' %}">Menu</a></h3>
            <button id="close-sidebar" aria-label="Close menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav class="sidebar-links">
            <a href="{% url 'feedback' %}"><i class="fa-solid fa-comment"></i> Relatar Feedback</a>
        </nav>
    </div>

    <div id="map-container">
        <header>
            <form id="search" class="padding" action="" method="get" role="search">
                <div id="search-header">
                    <img src="{% static 'img/logo-pequeno.png' %}">
                    <label id="search-label" for="search-field"><i class="fa-solid fa-magnifying-glass" style="color: gray;"></i></label>
                    <input type="search" id="search-field" name="q" placeholder="Pesquisar local..." autocomplete="off">
                </div>

                <div id="route-fields" class="hidden">
                    <button type="button" class="route-icon-btn" id="route-close" aria-label="Sair das rotas">
                        <i class="fa-solid fa-arrow-left"></i>
                    </button>

                    <div class="route-inputs">
                        <div class="route-field route-field--origin">
                            <span class="route-dot"></span>
                            <input type="search" id="route-origin" placeholder="Local de partida" autocomplete="off">
                        </div>
                        <div class="route-field route-field--destination">
                            <i class="fa-solid fa-location-dot"></i>
                            <input type="search" id="route-destination" placeholder="Destino" autocomplete="off">
                        </div>
                    </div>

                    <button type="button" class="route-icon-btn" id="route-swap" aria-label="Inverter partida e destino">
                        <i class="fa-solid fa-right-left"></i>
                    </button>
                </div>

                <div id="search-expansion" class="hidden">
                    <hr>
                    <ol id="search-list"></ol>
                </div>
            </form>
            <button class="padding" id="options"><i class="fa-solid fa-bars"></i></button>
        </header>

        <div id="map"></div>

        <button class="padding icon" id="orientation"><img src="{% static 'img/compass.png' %}" alt="Bússola"></button>

        <div id="user-tab" class="collapsed">
            <img id="user-avatar" src="{% static 'img/default-user.png' %}" alt="Foto do usuário">

            <div id="user-info">
                <h3 id="user-name">Você</h3>
                <p>Atualmente em: <strong id="user-place">—</strong></p>
                <p>No IF desde: <strong id="user-since">—</strong></p>
            </div>

            <button type="button" id="share-location">
                <i class="fa-solid fa-location-arrow"></i>
                <span>Compartilhar localização atual</span>
            </button>
        </div>
    </div>

    <section id="screen-ui" class="hidden main-ui">
        <article id="banner" class="banner-view">
            <form class="banner-form" id="bannerForm">
                <label
                    for="banner-image-input"
                    class="image-upload-wrapper"
                    id="image-upload-wrapper"
                    style="pointer-events: none !important;">
                    <input
                        type="file"
                        id="banner-image-input"
                        accept="image/*"
                        disabled>
                </label>

                <div class="banner-content">
                    <input
                        type="text"
                        class="editable-title"
                        id="place-name"
                        placeholder="Nome da construção"
                        readonly>

                    <div class="banner-actions">
                        <button type="button" class="banner-action banner-action--primary" id="banner-route">
                            <i class="fa-solid fa-diamond-turn-right"></i>
                            <span>Rotas</span>
                        </button>
                        <button type="button" class="banner-action banner-action--secondary" id="banner-share">
                            <i class="fa-solid fa-share-nodes"></i>
                            <span>Compartilhar</span>
                        </button>
                    </div>

                    <hr class="banner-divider">

                    <div class="banner-section">
                        <h4 class="banner-section-title">Sobre</h4>
                        <textarea
                            class="editable-description"
                            id="place-description"
                            placeholder=" "
                            readonly
                        ></textarea>
                    </div>
                </div>
            </form>
        </article>
    </section>

    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>

    <script>
        const config = "{% static 'json/config.json' %}";
        const mapImage =  "{% static 'svg/mapa.svg' %}";
        const pinImage = "{% static 'img/pino.png' %}";
        const entranceImage = "{% static 'img/entrance.png' %}";
        const defaultUserImage = "{% static 'img/default-user.png' %}";
        const URLSaveMap = window.location.origin + "{% url 'mapa_editor_data' %}";
        const URLLoadMap = window.location.origin + "{% url 'mapa_editor_load' %}";
        let sharePlaceLat = "{{ lat }}";
        let sharePlaceLong = "{{ long }}";
        let shareRender = "{{ r }}";
        const defaultImage = "{% static 'img/ifrn-logotipo.png' %}";

        (function() {
            const params = new URLSearchParams(window.location.search);
            const xParam = params.get("x");
            const yParam = params.get("y");

            if (xParam !== null && yParam !== null) {
                const x = parseFloat(xParam);
                const y = parseFloat(yParam);

                if (!isNaN(x) && !isNaN(y)) {
                    window.initialCoordinates = { x, y };
                    console.log("Coordenadas extraídas da URL:", window.initialCoordinates);
                }
            }
        })();
    </script>
    <script src="https://pixijs.download/release/pixi.min.js"></script>
    
    <script type="module" src="{% static 'js/mapa.js' %}"></script>
</main>
{% endblock %}
