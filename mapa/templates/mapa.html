{% extends 'base.html' %}

{% load static %}

{% block title %}MapaCNAT | Explorar{% endblock %}

{% block style %}<link rel="stylesheet" href="{% static 'css/mapa.css' %}">{% endblock %}

{% block content %}
<main id="app-layout">
    <div id="sidebar-backdrop" class="sidebar-backdrop"></div>

    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <h3><a href="{% url 'home' %}">Menu</a></h3>
            <button id="close-sidebar" aria-label="Close menu">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav class="sidebar-links">
            <a href="{% url 'feedback' %}"><i class="fa-solid fa-comment"></i> Relatar Feedback</a>
        </nav>
    </div>

    <div id="map-container">
        <header>
            <form id="search" class="padding" action="" method="get" role="search">
                <div id="search-header">
                    <img src="{% static 'img/logo-pequeno.png' %}">
                    <label id="search-label" for="search-field"><i class="fa-solid fa-magnifying-glass" style="color: gray;"></i></label>
                    <input type="search" id="search-field" name="q" placeholder="Pesquisar local..." required>
                </div>
                <div id="search-expansion" class="hidden">
                    <hr>
                    <ol id="search-list"></ol>
                </div>
            </form>
            <button class="padding" id="options"><i class="fa-solid fa-bars"></i></button>
        </header>

        <div id="map"></div>

        <button class="padding icon" id="orientation"><i class="fa-solid fa-compass"></i></button>
    </div>

    <section id="screen-ui" class="hidden main-ui">
        <article id="banner">
            <form class="banner-form" id="bannerForm">
                <label 
                    for="banner-image-input" 
                    class="image-upload-wrapper" 
                    id="image-upload-wrapper"
                    style="pointer-events: none !important;">
                    <input 
                        type="file" 
                        id="banner-image-input" 
                        accept="image/*"
                        disabled>
                </label>

                <div class="banner-content">
                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px;">
                        <input 
                            type="text" 
                            class="editable-title" 
                            id="place-name" 
                            placeholder="Nome da construção"
                            readonly>
                        
                        <button type="button" id="share-location-btn" title="Partilhar Localização" style="background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #555; padding: 4px;">
                            <i class="fa-solid fa-share-nodes"></i>
                        </button>
                    </div>

                    <hr class="banner-divider">

                    <textarea 
                        class="editable-description" 
                        id="place-description" 
                        placeholder=""
                        readonly
                    ></textarea>
                </div>
            </form>
        </article>
    </section>

    <script>
        const config = "{% static 'json/config.json' %}";
        const mapImage =  "{% static 'svg/mapa.svg' %}";
        const pinImage = "{% static 'img/pino.png' %}";
        const entranceImage = "{% static 'img/entrance.png' %}";
        const URLSaveMap = window.location.origin + "{% url 'mapa_editor_data' %}";
        const URLNameSearch = window.location.origin + "{% url 'name_search' %}";
        const defaultImage = "{% static 'img/ifrn-logotipo.png' %}";

        (function() {
            const params = new URLSearchParams(window.location.search);
            const xParam = params.get("x");
            const yParam = params.get("y");

            if (xParam !== null && yParam !== null) {
                const x = parseFloat(xParam);
                const y = parseFloat(yParam);

                if (!isNaN(x) && !isNaN(y)) {
                    window.initialCoordinates = { x, y };
                    console.log("Coordenadas extraídas da URL:", window.initialCoordinates);
                }
            }
        })();
    </script>
    <script src="https://pixijs.download/release/pixi.min.js"></script>
    <script type="module" src="{% static 'js/mapa.js' %}"></script>
</main>
{% endblock %}
