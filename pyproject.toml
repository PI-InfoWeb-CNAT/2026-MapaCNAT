[project]
name = "mapa-cnat"
version = "0.1.0"
description = "Aplicação MapaCNAT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.11.1",
    "Django==6.0.4",
    "sqlparse==0.5.5",
    "tzdata==2026.1",
    "pillow==12.3.0",
    "whitenoise==6.12.0",
    "psycopg2-binary==2.9.13",
    "dj-database-url==3.1.2",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"