[project]
name = "mapa-cnat"
version = "0.1.0"
description = "MapaCNAT Django application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref==3.12.1",
    "certifi==2026.10.23",
    "cffi==2.1.1",
    "charset-normalizer==3.5.2",
    "cryptography==50.0.2",
    "dj-database-url==3.1.2",
    "Django==6.1.1",
    "django-allauth==65.22.1",
    "idna==3.20",
    "oauthlib==4.0.1",
    "pillow==12.3.0",
    "psycopg2-binary==2.9.13",
    "pycparser==3.12",
    "PyJWT==2.15.1",
    "requests==2.34.2",
    "sqlparse==0.6.0",
    "tzdata==2026.4",
    "urllib3==2.8.0",
    "whitenoise==6.12.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["mapa_cnat*"]
exclude = ["staticfiles*"]